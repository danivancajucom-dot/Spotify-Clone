<!-- confirm dialog (js/modules/dialog.js) -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="dialog">
    <div class="badge" id="m-icon"></div>
    <h3 id="m-title"></h3>
    <p id="m-text"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="m-cancel">Cancel</button>
      <button type="button" class="btn" id="m-ok">Confirm</button>
    </div>
  </div>
</div>
