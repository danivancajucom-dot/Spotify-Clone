{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}
    <a class="page-btn" href="?page=1" aria-label="First page">«</a>
    <a class="page-btn" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous page">‹</a>
  {% else %}
    <span class="page-btn disabled">«</span>
    <span class="page-btn disabled">‹</span>
  {% endif %}

  <span class="page-status">
    Page <strong>{{ page_obj.number }}</strong> of {{ page_obj.paginator.num_pages }}
  </span>

  {% if page_obj.has_next %}
    <a class="page-btn" href="?page={{ page_obj.next_page_number }}" aria-label="Next page">›</a>
    <a class="page-btn" href="?page={{ page_obj.paginator.num_pages }}" aria-label="Last page">»</a>
  {% else %}
    <span class="page-btn disabled">›</span>
    <span class="page-btn disabled">»</span>
  {% endif %}
</nav>
{% endif %}
